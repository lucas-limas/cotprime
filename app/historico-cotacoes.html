<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CotPrime — Histórico de cotações</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* Tokens semânticos — idênticos ao shell/CRM (dark default) */
:root{
  --navy:#1f1e1e;--navy2:#2a2929;--navy3:#141414;
  /* acento monocromático: escuro->botão claro / claro->botão escuro (igual ao cotador) */
  --accent:#f0f0f0;--accent-ink:#1a1a1a;
  --bg:var(--navy);--surface2:var(--navy2);
  --card:rgba(255,255,255,.04);--inp:rgba(255,255,255,.06);
  --bd1:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.1);--bd3:rgba(255,255,255,.15);
  --inp-bd:rgba(255,255,255,.12);
  --t1:#fff;--t2:rgba(255,255,255,.75);--t3:rgba(255,255,255,.5);
  --t4:rgba(255,255,255,.4);
  --tab-active:rgba(255,255,255,.1);--btn-bg:rgba(255,255,255,.1);--btn-t:rgba(255,255,255,.7);
  --green:#22c55e;--red:#f87171;
  /* gráfico: barras cinza neutras; barra atual no acento monocromático */
  --bar:rgba(255,255,255,.5);--bar-cur:var(--accent);
}
html[data-theme="light"]{
  --bg:#eef1f5;--surface2:#ffffff;--accent:#1f1e1e;--accent-ink:#fff;
  --card:rgba(0,0,0,.03);--inp:rgba(0,0,0,.05);
  --bd1:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.1);--bd3:rgba(0,0,0,.16);
  --inp-bd:rgba(0,0,0,.14);
  --t1:#111827;--t2:rgba(0,0,0,.75);--t3:rgba(0,0,0,.55);
  --t4:rgba(0,0,0,.45);
  --tab-active:rgba(0,0,0,.07);--btn-bg:rgba(0,0,0,.07);--btn-t:rgba(0,0,0,.65);
  --bar:rgba(0,0,0,.28);--bar-cur:var(--accent);
}

html,body{height:100%}
body{font-family:"Outfit",system-ui,sans-serif;background:var(--bg);color:var(--t1);overflow-y:auto;font-size:13px;line-height:1.5}
.page{max-width:980px;margin:0 auto;padding:1.5rem 1.5rem 3rem}

.title{font-size:20px;font-weight:700;letter-spacing:-.2px;margin-bottom:2px}
.subtitle{font-size:12px;color:var(--t3);margin-bottom:1.25rem}

.card{background:var(--card);border:1px solid var(--bd1);border-radius:12px}
.card-head{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);padding:11px 16px;border-bottom:1px solid var(--bd1);display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ── CARDS DE MÉTRICA ── */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.metric-body{padding:16px}
.metric-num{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1}
.metric-lbl{font-size:11px;color:var(--t3);margin-top:4px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-top:8px}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--t3)}
.delta-sub{font-size:11px;color:var(--t4);font-weight:400;margin-left:2px}

/* toggle Semana/Mês */
.toggle{display:flex;gap:0;border:1px solid var(--bd2);border-radius:8px;overflow:hidden}
.toggle button{padding:5px 13px;border:none;background:transparent;color:var(--t3);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.toggle button.on{background:var(--accent);color:var(--accent-ink)}

/* ── GRÁFICO ── */
.chart-card{margin-bottom:1rem}
#chart-wrap{padding:14px 16px 8px}
#chart-wrap svg{display:block;width:100%;height:auto}
.bar{fill:var(--bar);transition:fill .15s}
.bar-cur{fill:var(--bar-cur)}
.bar-val{fill:var(--t2);font-size:10px;font-weight:700;font-family:"Outfit",sans-serif}
.bar-lbl{fill:var(--t3);font-size:9px;font-family:"Outfit",sans-serif}
.empty{padding:2rem 1rem;text-align:center;color:var(--t3);font-size:12px;font-style:italic}

/* ── INTERVALO ── */
.range-card{margin-bottom:1rem}
.range-body{padding:14px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.field input{font-family:inherit;font-size:13px;background:var(--inp);border:1.5px solid var(--inp-bd);border-radius:7px;padding:7px 10px;color:var(--t1);outline:none;color-scheme:dark}
html[data-theme="light"] .field input{color-scheme:light}
.btn{padding:8px 16px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:none;background:var(--accent);color:var(--accent-ink);transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.88}
.range-result{font-size:13px;color:var(--t2);margin-left:auto;font-weight:500}

/* ── LISTA ── */
.list-card .card-head{margin-bottom:0}
.hist-item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 16px;border-bottom:1px solid var(--bd1);align-items:center}
.hist-item:last-child{border-bottom:none}
.hist-nome{font-size:14px;font-weight:600;color:var(--t1)}
.hist-meta{font-size:11px;color:var(--t3);margin-top:2px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.hist-meta .sep{opacity:.5}
.hist-actions{display:flex;gap:6px;align-items:center}
.act{padding:5px 11px;border-radius:6px;border:1px solid var(--bd2);background:var(--btn-bg);color:var(--btn-t);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;white-space:nowrap}
.act:hover{background:var(--tab-active);color:var(--t1)}
.act-open{border-color:var(--bd3);color:var(--t1)}
.act-open:hover{background:var(--tab-active);color:var(--t1)}
.act-del:hover{background:rgba(248,113,113,.14);color:#f87171;border-color:rgba(248,113,113,.4)}
.act-crm{border-color:rgba(70,27,255,.35);color:#8b7bff}
.act-crm:hover{background:rgba(70,27,255,.12)}
.list-empty,.list-error{padding:2.5rem 1rem;text-align:center;color:var(--t3);font-size:13px}
.list-error{color:var(--red)}

/* ── Fase A: barra de filtros + status ── */
.filterbar{padding:12px 16px;border-bottom:1px solid var(--bd1);display:flex;flex-direction:column;gap:10px}
.fb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--inp);border:1.5px solid var(--inp-bd);border-radius:8px;padding:7px 11px}
.search input{flex:1;border:none;background:transparent;color:var(--t1);font-family:inherit;font-size:13px;outline:none}
.search svg{flex-shrink:0;opacity:.5}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 11px;font-size:11px;font-weight:600;border:1px solid var(--bd2);border-radius:20px;background:transparent;color:var(--t3);cursor:pointer;transition:all .12s}
.chip:hover{color:var(--t2);border-color:var(--bd3)}
.chip.active{color:#fff;border-color:transparent}
.chip[data-s="todos"].active{background:var(--accent);color:var(--accent-ink)}
.chip[data-s="lead"].active{background:#6b7280}
.chip[data-s="contato"].active{background:#3b82f6}
.chip[data-s="negociacao"].active{background:#f59e0b;color:#1a1a1a}
.chip[data-s="implementacao"].active{background:#f97316;color:#1a1a1a}
.chip[data-s="fechado"].active{background:#22c55e;color:#1a1a1a}
.chip[data-s="perdido"].active{background:#ef4444}
.chip[data-s="sem"].active{background:#9ca3af;color:#1a1a1a}
.hist-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;color:var(--t1);background:var(--card);border:1px solid var(--bd2);white-space:nowrap}
.st-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

@media(max-width:640px){
  .metrics{grid-template-columns:1fr}
  .hist-item{grid-template-columns:1fr}
  .hist-actions{justify-content:flex-start}
  .range-result{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="page">
  <div class="title">Histórico de cotações</div>
  <div class="subtitle">Suas cotações salvas · contagens e tendências</div>

  <!-- MÉTRICAS -->
  <div class="metrics">
    <div class="card">
      <div class="card-head">Total de cotações</div>
      <div class="metric-body">
        <div class="metric-num" id="m-total">—</div>
        <div class="metric-lbl">desde o início</div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <span id="periodo-lbl">Esta semana</span>
        <div class="toggle">
          <button id="tg-week" class="on" onclick="setPeriod('week')">Semana</button>
          <button id="tg-month" onclick="setPeriod('month')">Mês</button>
        </div>
      </div>
      <div class="metric-body">
        <div class="metric-num" id="m-atual">—</div>
        <div class="delta flat" id="m-delta">—</div>
      </div>
    </div>
  </div>

  <!-- GRÁFICO -->
  <div class="card chart-card">
    <div class="card-head"><span id="chart-title">Últimas 8 semanas</span></div>
    <div id="chart-wrap"></div>
  </div>

  <!-- INTERVALO -->
  <div class="card range-card">
    <div class="card-head">Intervalo específico</div>
    <div class="range-body">
      <div class="field"><label>De</label><input type="date" id="r-from"></div>
      <div class="field"><label>Até</label><input type="date" id="r-to"></div>
      <button class="btn" onclick="verPeriodo()">Ver período</button>
      <span class="range-result" id="r-result"></span>
    </div>
  </div>

  <!-- LISTA -->
  <div class="card list-card">
    <div class="card-head"><span>Cotações</span><span id="hist-count"></span></div>

    <!-- Fase A: busca + exportar + chips de status -->
    <div class="filterbar">
      <div class="fb-row">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="hist-q" type="text" placeholder="Buscar por cliente ou operadora…" oninput="renderList()">
        </div>
        <button class="btn" onclick="exportarCSV()">⭳ Exportar CSV</button>
      </div>
      <div class="fb-row">
        <div class="chips" id="hist-chips">
          <button class="chip active" data-s="todos" onclick="setFiltroStatus('todos')">Todos</button>
          <button class="chip" data-s="lead" onclick="setFiltroStatus('lead')">Lead</button>
          <button class="chip" data-s="contato" onclick="setFiltroStatus('contato')">Contato</button>
          <button class="chip" data-s="negociacao" onclick="setFiltroStatus('negociacao')">Negociação</button>
          <button class="chip" data-s="implementacao" onclick="setFiltroStatus('implementacao')">Implementação</button>
          <button class="chip" data-s="fechado" onclick="setFiltroStatus('fechado')">Fechado</button>
          <button class="chip" data-s="perdido" onclick="setFiltroStatus('perdido')">Perdido</button>
          <button class="chip" data-s="sem" onclick="setFiltroStatus('sem')">Sem cliente</button>
        </div>
      </div>
    </div>

    <div id="hist-list"><div class="list-empty">Carregando…</div></div>
  </div>
</div>

<script>
let _period = 'week';
let _lista  = [];
let OP_NOME = {};

// Estágios do funil — IDÊNTICOS ao CRM (crm-saude-prime.html)
const STAGE_LABEL = {lead:'Lead',contato:'Contato',negociacao:'Negociação',implementacao:'Implementação',fechado:'Fechado',perdido:'Perdido'};
const STAGE_COLOR = {lead:'#6b7280',contato:'#3b82f6',negociacao:'#f59e0b',implementacao:'#f97316',fechado:'#22c55e',perdido:'#ef4444'};
let _filtroStatus = 'todos';
let _clienteEstagio = {};   // { [cliente_id]: estagio_atual } — espelho só-leitura do CRM

const f$ = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function _syncTheme(){
  let t = 'dark';
  try { t = (window.parent && window.parent.document.documentElement.getAttribute('data-theme')) || localStorage.getItem('adm_theme') || 'dark'; }
  catch(e){ t = localStorage.getItem('adm_theme') || 'dark'; }
  document.documentElement.setAttribute('data-theme', t);
}

function _token(){
  try { return (window.parent && window.parent.token && window.parent.token()) || null; }
  catch(e){ return null; }
}

async function api(path, opts){
  opts = opts || {};
  const tok = _token();
  const headers = Object.assign({}, opts.headers || {}, tok ? {'Authorization':'Bearer '+tok} : {});
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  if (r.status === 204) return null;
  return r.json();
}

/* ── DATAS ── */
function fmtDateTimeBR(s){
  if (!s) return '';
  const d = new Date(s.replace(' ','T') + 'Z');           // criado_em é UTC
  if (isNaN(d.getTime())) return s;
  return d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDateBR(iso){            // "YYYY-MM-DD" → "DD/MM/YYYY"
  const p = (iso||'').split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
}

/* ── MÉTRICAS + GRÁFICO ── */
function setPeriod(p){
  _period = p;
  document.getElementById('tg-week').classList.toggle('on', p === 'week');
  document.getElementById('tg-month').classList.toggle('on', p === 'month');
  document.getElementById('periodo-lbl').textContent = p === 'week' ? 'Esta semana' : 'Este mês';
  document.getElementById('chart-title').textContent = p === 'week' ? 'Últimas 8 semanas' : 'Últimos 6 meses';
  loadMetrics();
}

async function loadMetrics(){
  try {
    const d = await api('/api/cotacoes/metrics?period=' + _period);
    document.getElementById('m-total').textContent = d.total;
    document.getElementById('m-atual').textContent = d.atual;
    renderDelta(d.delta_pct, d.anterior);
    renderChart(d.serie || []);
  } catch(e){
    document.getElementById('m-total').textContent = '—';
    document.getElementById('m-atual').textContent = '—';
    document.getElementById('m-delta').className = 'delta flat';
    document.getElementById('m-delta').textContent = '—';
    document.getElementById('chart-wrap').innerHTML = '<div class="empty">Não foi possível carregar as métricas.</div>';
  }
}

function renderDelta(pct, anterior){
  const el = document.getElementById('m-delta');
  if (pct === null || pct === undefined){
    el.className = 'delta flat';
    el.innerHTML = '— <span class="delta-sub">sem período anterior</span>';
    return;
  }
  const val = Math.abs(pct).toFixed(1).replace('.', ',') + '%';
  if (pct > 0){ el.className = 'delta up';   el.innerHTML = '↑ ' + val + ' <span class="delta-sub">vs. período anterior</span>'; }
  else if (pct < 0){ el.className = 'delta down'; el.innerHTML = '↓ ' + val + ' <span class="delta-sub">vs. período anterior</span>'; }
  else { el.className = 'delta flat'; el.innerHTML = '0,0% <span class="delta-sub">vs. período anterior</span>'; }
}

function renderChart(serie){
  const wrap = document.getElementById('chart-wrap');
  if (!serie.length){ wrap.innerHTML = '<div class="empty">Sem dados.</div>'; return; }
  const max = Math.max.apply(null, serie.map(s => s.count));
  if (max === 0){ wrap.innerHTML = '<div class="empty">Sem cotações no período</div>'; return; }
  const n = serie.length, slot = 44, W = n * slot, H = 140, top = 20, bot = 24, chartH = H - top - bot;
  const bw = slot * 0.52;
  let svg = '';
  serie.forEach((s, i) => {
    const cur = (i === n - 1);
    const h = s.count > 0 ? Math.max(3, (s.count / max) * chartH) : 2;
    const x = i * slot + (slot - bw) / 2;
    const y = top + (chartH - h);
    const cx = i * slot + slot / 2;
    svg += `<rect class="bar${cur ? ' bar-cur' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${s.label}: ${s.count}</title></rect>`;
    if (s.count > 0) svg += `<text class="bar-val" x="${cx.toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle">${s.count}</text>`;
    svg += `<text class="bar-lbl" x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${s.label}</text>`;
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cotações por período">${svg}</svg>`;
}

/* ── INTERVALO ── */
async function verPeriodo(){
  const from = document.getElementById('r-from').value;
  const to   = document.getElementById('r-to').value;
  const out  = document.getElementById('r-result');
  if (!from || !to){ out.textContent = 'Selecione as duas datas.'; return; }
  out.textContent = 'Calculando…';
  try {
    const d = await api(`/api/cotacoes/metrics?from=${from}&to=${to}`);
    out.textContent = `${d.count} cotação${d.count === 1 ? '' : 's'} entre ${fmtDateBR(from)} e ${fmtDateBR(to)}`;
  } catch(e){
    out.textContent = (String(e).includes('400')) ? 'Intervalo inválido.' : 'Erro ao calcular o período.';
  }
}

/* ── LISTA ── */
async function loadCatalogo(){
  try {
    const tok = _token();
    const c = await fetch('/api/catalogo', {headers: tok ? {'Authorization': 'Bearer ' + tok} : {}}).then(r => r.ok ? r.json() : null);
    OP_NOME = {};
    if (c && c.operadoras) Object.entries(c.operadoras).forEach(([k,v]) => { OP_NOME[k] = (v && v.nome) || k; });
  } catch(e){ /* mantém vazio; cai no fallback da chave */ }
}

// Espelho só-leitura do estágio de cada cliente (mesma fonte do CRM: GET /api/clientes)
async function loadClientes(){
  try {
    const cs = await api('/api/clientes') || [];
    _clienteEstagio = {};
    cs.forEach(c => { if (c && c.id != null) _clienteEstagio[c.id] = c.estagio_atual || 'lead'; });
  } catch(e){ _clienteEstagio = {}; }   // sem clientes → tudo cai em "Sem cliente"
}

function _estagioDe(it){
  const cid = (it.dados || {}).cliente_id || null;
  return (cid && _clienteEstagio[cid]) ? _clienteEstagio[cid] : null;
}
function _opNomeDe(it){
  const w = (it.dados || {}).winner;
  return w ? (OP_NOME[w] || w) : '';
}
function _badgeHtml(est){
  if (!est) return '<span class="st-badge"><span class="st-dot" style="background:#9ca3af"></span>Sem cliente</span>';
  return `<span class="st-badge"><span class="st-dot" style="background:${STAGE_COLOR[est] || '#9ca3af'}"></span>${STAGE_LABEL[est] || esc(est)}</span>`;
}
function _cotacaoVisivel(it){
  const stKey = _estagioDe(it) || 'sem';
  if (_filtroStatus !== 'todos' && stKey !== _filtroStatus) return false;
  const inp = document.getElementById('hist-q');
  const q = (inp ? inp.value : '').trim().toLowerCase();
  if (q){
    const d = it.dados || {};
    const nome = (d.nome || it.cliente || '').toLowerCase();
    const op = _opNomeDe(it).toLowerCase();
    if (!nome.includes(q) && !op.includes(q)) return false;
  }
  return true;
}

async function loadList(){
  const box = document.getElementById('hist-list');
  try {
    const [cot] = await Promise.all([ api('/api/cotacoes'), loadClientes() ]);
    _lista = cot || [];
  } catch(e){
    box.innerHTML = '<div class="list-error">Não foi possível carregar as cotações.</div>';
    return;
  }
  renderList();
}

function renderList(){
  const box = document.getElementById('hist-list');
  const countEl = document.getElementById('hist-count');
  if (!_lista.length){
    if (countEl) countEl.textContent = '';
    box.innerHTML = '<div class="list-empty">Nenhuma cotação salva ainda.<br>As cotações são salvas ao gerar a Apresentação no cotador.</div>';
    return;
  }
  const vis = _lista.filter(_cotacaoVisivel);
  if (countEl) countEl.textContent = vis.length + (vis.length === 1 ? ' cotação' : ' cotações');
  if (!vis.length){
    box.innerHTML = '<div class="list-empty">Nenhuma cotação para este filtro.</div>';
    return;
  }
  box.innerHTML = vis.map(it => {
    const d = it.dados || {};
    const nome = d.nome || it.cliente || 'Sem nome';
    const vidas = d.totalVidas != null ? d.totalVidas : 0;
    const opNome = _opNomeDe(it);
    const cid = d.cliente_id || null;
    const est = _estagioDe(it);
    const meta = [
      fmtDateTimeBR(it.criado_em),
      `${vidas} vida${vidas === 1 ? '' : 's'}`,
      opNome ? opNome : 'sem operadora',
    ];
    if (d.winnerTotal > 0) meta.push(f$(d.winnerTotal) + '/mês');
    // "Ver no CRM" só quando o cliente AINDA EXISTE (est != null). Cliente excluído do
    // CRM mantém dados.cliente_id na cotação, mas não deve oferecer link p/ lead morto.
    const crmLink = est
      ? `<a class="act act-crm" href="crm-saude-prime.html" target="_top" onclick="event.stopPropagation();sessionStorage.setItem('crm_cliente_id','${cid}')">Ver no CRM</a>`
      : '';
    return `<div class="hist-item">
      <div>
        <div class="hist-top">
          <span class="hist-nome">${esc(nome)}</span>
          ${_badgeHtml(est)}
        </div>
        <div class="hist-meta">${meta.map((m,i) => (i ? '<span class="sep">·</span>' : '') + esc(String(m))).join(' ')}</div>
      </div>
      <div class="hist-actions">
        <button class="act act-open" onclick="abrirCotacao(${it.id})">Abrir</button>
        <button class="act" onclick="regenerarPDF(${it.id})" title="Regenerar a apresentação com os preços atuais">PDF</button>
        ${crmLink}
        <button class="act act-del" onclick="excluirCotacao(${it.id})" title="Excluir">✕</button>
      </div>
    </div>`;
  }).join('');
}

function setFiltroStatus(s){
  _filtroStatus = s;
  document.querySelectorAll('#hist-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.s === s));
  renderList();
}

function exportarCSV(){
  const vis = _lista.filter(_cotacaoVisivel);
  if (!vis.length){ alert('Nada para exportar com o filtro/busca atual.'); return; }
  const linhas = [['Cliente','Operadora','Vidas','Total','Status','Data']];
  vis.forEach(it => {
    const d = it.dados || {};
    const est = _estagioDe(it);
    linhas.push([
      d.nome || it.cliente || 'Sem nome',
      _opNomeDe(it) || 'sem operadora',
      d.totalVidas != null ? d.totalVidas : 0,
      d.winnerTotal > 0 ? f$(d.winnerTotal) : '',
      est ? (STAGE_LABEL[est] || est) : 'Sem cliente',
      fmtDateTimeBR(it.criado_em),
    ]);
  });
  const csv = linhas.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([String.fromCharCode(0xFEFF) + csv], {type:'text/csv;charset=utf-8'});   // BOM p/ Excel abrir acentos
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cotacoes.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── AÇÕES ── */
function abrirCotacao(id){
  const it = _lista.find(x => String(x.id) === String(id));
  if (!it) return;
  try {
    if (window.parent && window.parent.showCotador) window.parent.showCotador();
    const cot = window.parent.document.getElementById('cotador');
    if (cot && cot.contentWindow && cot.contentWindow.restaurarCotacaoFromObj){
      cot.contentWindow.restaurarCotacaoFromObj(it.dados, true);
    }
  } catch(e){ /* fora do shell: nada a fazer */ }
}

function regenerarPDF(id){
  const it = _lista.find(x => String(x.id) === String(id));
  if (!it) return;
  try {
    const cot = window.parent.document.getElementById('cotador');
    if (cot && cot.contentWindow && cot.contentWindow.regenerarApresentacao){
      cot.contentWindow.regenerarApresentacao(it.dados);   // restaura + recomputa + abre Apresentação
    }
  } catch(e){ /* fora do shell: nada a fazer */ }
}

async function excluirCotacao(id){
  if (!confirm('Excluir esta cotação? Esta ação não pode ser desfeita.')) return;
  try {
    await api('/api/cotacoes/' + id, {method:'DELETE'});
  } catch(e){
    alert('Não foi possível excluir a cotação.');
    return;
  }
  await loadList();
  loadMetrics();   // a contagem cai
}

/* ── ENTRADA / REFRESH (chamado pelo shell em showHistorico) ── */
function refreshHistorico(){
  _syncTheme();
  loadCatalogo().then(loadList);
  loadMetrics();
}
window.refreshHistorico = refreshHistorico;

document.addEventListener('DOMContentLoaded', () => {
  // defaults do intervalo: 1º do mês atual → hoje (horário local do navegador)
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  document.getElementById('r-from').value = iso(new Date(now.getFullYear(), now.getMonth(), 1));
  document.getElementById('r-to').value   = iso(now);
  refreshHistorico();
});
</script>
